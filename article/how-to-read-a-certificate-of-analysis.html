  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is on a peptide certificate of analysis?","acceptedAnswer":{"@type":"Answer","text":"A COA reports the batch or lot number, the purity (usually from HPLC), the identity (usually from mass spectrometry), the analysis date, and the testing methods used. Together these say which batch it is, how pure it is, and whether it is the right molecule."}},{"@type":"Question","name":"Why does the batch number on a COA matter?","acceptedAnswer":{"@type":"Answer","text":"The batch number links the document to a specific vial. If the number on the COA does not match the number on the label, the certificate does not describe your material. It is also the number used to verify a batch is genuine."}},{"@type":"Question","name":"Is a purity percentage enough on its own?","acceptedAnswer":{"@type":"Answer","text":"No. Purity tells you how much of the sample is one main component, but not that the component is the correct peptide. A complete COA pairs HPLC purity with a mass spectrometry identity check."}}]}</script>
