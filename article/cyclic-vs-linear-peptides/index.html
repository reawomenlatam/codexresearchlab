  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is the difference between cyclic and linear peptides?","acceptedAnswer":{"@type":"Answer","text":"A linear peptide is a chain of amino acids with two open ends. A cyclic peptide is a chain joined into a ring. Closing the loop removes the loose ends and locks the shape, which changes rigidity and often stability."}},{"@type":"Question","name":"Why are some peptides made cyclic?","acceptedAnswer":{"@type":"Answer","text":"A ring holds the molecule in a more fixed arrangement, which can change how it fits a receptor and can make it more resistant to enzymes that break down linear peptides. Some research peptides are cyclic by design for those reasons."}},{"@type":"Question","name":"Is PT-141 a cyclic peptide?","acceptedAnswer":{"@type":"Answer","text":"Yes, PT-141 is an example of a cyclic peptide studied in research. Its structure, like any peptide, is confirmed by mass spectrometry and purity testing and reported on its certificate of analysis."}}]}</script>
