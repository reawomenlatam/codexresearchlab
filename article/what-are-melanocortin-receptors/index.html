  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What are melanocortin receptors?","acceptedAnswer":{"@type":"Answer","text":"They are a family of receptors that respond to signaling molecules called melanocortins. There are several subtypes, commonly labeled MC1R through MC5R, spread across different tissues and involved in processes from pigmentation to central signaling."}},{"@type":"Question","name":"How many melanocortin receptors are there?","acceptedAnswer":{"@type":"Answer","text":"The family is usually described as having five members, MC1R through MC5R. They are found in different tissues and are associated with different processes, which is why selectivity across subtypes is a common research question."}},{"@type":"Question","name":"Which peptide acts on melanocortin receptors?","acceptedAnswer":{"@type":"Answer","text":"PT-141, also called bremelanotide, is a well-known example studied as a melanocortin receptor agonist, particularly at subtypes tied to central signaling. It is used strictly for laboratory research."}}]}</script>
