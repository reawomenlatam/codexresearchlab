  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is bacteriostatic water?","acceptedAnswer":{"@type":"Answer","text":"Bacteriostatic water is sterile water with a small amount of benzyl alcohol (around 0.9 percent) added as a preservative. The preservative slows bacterial growth, which is what makes it suitable for a vial that will be entered more than once."}},{"@type":"Question","name":"What is the difference between bacteriostatic and sterile water?","acceptedAnswer":{"@type":"Answer","text":"Sterile water for injection has nothing added and is meant for single use. Bacteriostatic water contains benzyl alcohol as a preservative, so it can tolerate being drawn from multiple times, which suits a multi-dose research vial."}},{"@type":"Question","name":"Why is bacteriostatic water used to reconstitute peptides?","acceptedAnswer":{"@type":"Answer","text":"It dissolves most peptides cleanly and its preservative supports multiple draws from a single vial over the days or weeks a peptide might be studied. That reusability is the main practical reason labs choose it."}}]}</script>
